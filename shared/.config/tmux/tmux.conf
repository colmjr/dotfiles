set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-features ",xterm-ghostty:usstyle"
set -ga terminal-features ",xterm-ghostty:extkeys"
# allow image protocols (kitty graphics) to pass through, needed for rmpc album art
set -g allow-passthrough on

# forward modified keys (e.g. Shift+Enter) to apps using the kitty protocol
set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set -g prefix C-a

set -g focus-events on

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind r source-file ~/.config/tmux/tmux.conf

set -g detach-on-destroy off # killing a session switches to the next one instead of detaching

set -g mouse on

set -g status-position bottom

# Tab names come from tmux itself: running program while a command runs,
# blank at the prompt (the format hides bare shells). This works now that no
# pty wrapper sits between tmux and the shell.
set-option -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{||:#{||:#{==:#{pane_current_command},fish},#{==:#{pane_current_command},zsh}},#{==:#{pane_current_command},bash}},,#{pane_current_command}}'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000 # scrollback history

# vim keybinds
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session' # restore nvim sessions if you use :mksession
set -g @continuum-restore 'off' # manual reboot is prefix + C-r
set -g @continuum-save-interval '5' # manual save is prefix + C-s

set -g @catppuccin_flavor 'macchiato'
# no contrasting bar: the status line sits directly on the terminal background
set -g @catppuccin_status_background 'none'

# status-left/right must be set before tpm runs so tmux-continuum can
# still prepend its auto-save hook to status-right.
set -g status-left '#[fg=#{@thm_blue},bold] #S  '
set -g status-left-length 40
set -g status-right '#[fg=#{@thm_overlay_1}]#{b:pane_current_path}  #H '

run '~/.config/tmux/plugins/tpm/tpm'

# flat minimal status line: overrides the plugin's pill/separator styling.
# Everything on the terminal background, one blue accent for the current
# window number and session name, dim gray for the rest.
set -g status-style 'bg=default,fg=#{@thm_fg}'
set -g window-status-separator ''
set -g window-status-format '#[fg=#{@thm_overlay_1}] #I #W '
set -g window-status-current-format '#[fg=#{@thm_blue},bold] #I #[fg=#{@thm_fg},bold]#W '

# vim-tmux-navigator: the plugin's stock is_vim check (ps -t '#{pane_tty}')
# can't see nvim because iris runs programs on its own pty, so C-hjkl were
# always treated as tmux pane switches and never reached nvim. Rebind with a
# check that walks the pane's whole process tree instead. Must come after
# `run tpm` so it overrides the plugin's bindings.
is_vim="~/.config/tmux/is-vim.sh #{pane_pid}"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
