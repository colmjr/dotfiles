set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -ga terminal-features ",xterm-ghostty:usstyle"
set -ga terminal-features ",xterm-ghostty:extkeys"

# forward modified keys (e.g. Shift+Enter) to apps using the kitty protocol
set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set -g prefix C-a

set -g focus-events on

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind r source-file ~/.config/tmux/tmux.conf

set -g detach-on-destroy off # killing a session switches to the next one instead of detaching

set -g mouse on

set -g status-position bottom

# Tab names come from zsh itself (preexec escape in .zshrc): running program
# while a command runs, blank at the prompt. tmux's automatic-rename can't see
# through iris's pty (it would name every tab 'iris'), so it stays off.
set-option -g allow-rename on
set -g automatic-rename off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000 # scrollback history

# vim keybinds
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session' # restore nvim sessions if you use :mksession
set -g @continuum-restore 'off' # manual reboot is prefix + C-r
set -g @continuum-save-interval '5' # manual save is prefix + C-s

set -g @rose_pine_variant 'main'
set -g @rose_pine_bar_bg_disable 'off'
set -g @rose_pine_host 'on'
set -g @rose_pine_directory 'on'

run '~/.config/tmux/plugins/tpm/tpm'

# vim-tmux-navigator: the plugin's stock is_vim check (ps -t '#{pane_tty}')
# can't see nvim because iris runs programs on its own pty, so C-hjkl were
# always treated as tmux pane switches and never reached nvim. Rebind with a
# check that walks the pane's whole process tree instead. Must come after
# `run tpm` so it overrides the plugin's bindings.
is_vim="~/.config/tmux/is-vim.sh #{pane_pid}"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
